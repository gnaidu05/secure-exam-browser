name: Build installers

# Every approved update to main produces fresh downloadable packages.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  student-windows:
    name: Student Secure Browser (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Student-Secure-Browser-Windows
          path: client/dist/*.exe

  admin-windows:
    name: Admin Server (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Assemble self-contained admin server
        shell: pwsh
        run: |
          npm prune --omit=dev
          New-Item -ItemType Directory -Force -Path dist-portable | Out-Null
          Copy-Item (node -p "process.execPath") dist-portable/node.exe
          Copy-Item central.js,server.js,central-settings.txt -Destination dist-portable
          Copy-Item lib,public,public-super,config,node_modules -Destination dist-portable -Recurse
          @'
          @echo off
          cd /d "%~dp0"
          start "" http://localhost:8443/super/
          node.exe central.js
          pause
          '@ | Set-Content -Path dist-portable/Start-Central-Admin-Server.cmd -Encoding ASCII
      - uses: actions/upload-artifact@v4
        with:
          name: Admin-Server-Windows
          path: server/dist-portable/**

  student-ubuntu:
    name: Student Secure Browser (Ubuntu)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Student-Secure-Browser-Ubuntu
          path: |
            client/dist/*.deb
            client/dist/*.AppImage
