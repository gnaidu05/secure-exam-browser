name: Build installers

# Manual runs make downloadable Windows packages without anyone using npm locally.
# A version tag also builds the same artifacts for release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  student-windows:
    name: Student Secure Browser (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Student-Secure-Browser-Windows
          path: client/dist/*.exe

  admin-windows:
    name: Admin Server (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:standalone
      - uses: actions/upload-artifact@v4
        with:
          name: Admin-Server-Windows
          path: server/dist-standalone/**

  student-ubuntu:
    name: Student Secure Browser (Ubuntu)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Student-Secure-Browser-Ubuntu
          path: |
            client/dist/*.deb
            client/dist/*.AppImage
